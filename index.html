<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Indo para o país das maravilhas</title>
</head>

<body>
    <div class="caixa-principal">
        <h1>Indo para o país das maravilhas</h1>
        <div class="tela-inicial">
            <p>Você está pronto para embarcar em uma aventura para chagar no País das maravilhas... Se sim, vamos começar a responder algumas perguntas. Dependendo das suas respostas você poderá chegar no País das Maravilhas ou no País das Desgraças....             </p>
            <button class="iniciar-btn">Iniciar</button>
        </div>
        <div class="caixa-perguntas"></div>
        <div class="caixa-alternativas"></div>
        <div class="caixa-resultado">
            <p class="texto-resultado"></p>
            <button class="novamente-btn">Jogar novamente</button>
        </div>
    </div>
    <script type="module" src="js/aleatorio.js"></script>
    <script type="module" src="js/perguntas.js"></script>
    <script type="module" src="js/script.js"></script>
</body>

</html>
